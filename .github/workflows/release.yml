name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@11.6.2
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches package.json version
        if: github.event_name == 'push'
        run: |
          expected="v$(node -p "require('./packages/astro-inertia/package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi
      - run: pnpm --filter astro-inertia build
      - run: pnpm --filter astro-inertia typecheck
      - run: pnpm test
      # npm runs the OIDC token exchange before it skips the upload, so a dry run
      # proves the trusted publisher entry without publishing anything.
      - name: Verify trusted publishing
        if: github.event_name == 'workflow_dispatch'
        working-directory: packages/astro-inertia
        run: |
          npm publish --dry-run --loglevel verbose 2>&1 | tee dry-run.log || true
          if grep -q 'Successfully retrieved and set token' dry-run.log; then
            echo "Trusted publishing authenticated."
          else
            echo "::error::OIDC exchange did not return a token. Check the npm trusted publisher entry for this repository and workflow file."
            grep -E 'oidc|requires you to be logged in' dry-run.log || true
            exit 1
          fi
      - name: Publish
        if: github.event_name == 'push'
        working-directory: packages/astro-inertia
        run: npm publish
      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
